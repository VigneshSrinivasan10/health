<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Daily Check-in</title>
  <meta name="description" content="A simple end-of-day mood check-in. How are you feeling? Pick your moods, rate them, jot a note. Local-only — your journal never leaves this device." />

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="./icons/favicon-64.png" sizes="64x64" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Check-in" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <main id="view" class="view"></main>
    <nav class="tabbar">
      <button class="tab active" data-tab="today">
        <svg viewBox="0 0 24 24" class="tab-ic" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/><path d="M8.5 14.5a4 4 0 0 0 7 0" stroke-linecap="round"/></svg>
        <span>Check-in</span>
      </button>
      <button class="tab" data-tab="history">
        <svg viewBox="0 0 24 24" class="tab-ic" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16" stroke-linecap="round"/></svg>
        <span>History</span>
      </button>
    </nav>
  </div>
  <div class="toast" id="toast"></div>

  <script src="./vendor/pouchdb.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
